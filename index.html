<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Calculator</title>
</head>
<link rel="stylesheet" href="style.css">
<body>
    <div id="calculator">
     
     <header id="header">
        <div id="header-line"></div>

        <div id="hedaing">
            <h1>Smart <span>Calculator</span></h1>
            <p>CALCULATE, LEARN & ACHIEVE</p>
        </div>
     </header>

     <div id="display">
        <div id="previous"></div>
        <div id="result"></div>
     </div>

     <div id="buttons">

        <button id="clear" data-action="clear">AC</button>
        <button id="delete" data-action="delete">DEL</button>
        <button data-action="percent">%</button>
        <button id="operator" data-value="/">/</button>

        <button data-value="7">7</button>
        <button data-value="8">8</button>
        <button data-value="9">9</button>
        <button id="operator" data-value="*">x</button>

        <button data-value="4">4</button>
        <button data-value="5">5</button>
        <button data-value="6">6</button>
        <button id="operator" data-value="-">-</button>

        <button data-value="1">1</button>
        <button data-value="2">2</button>
        <button data-value="3">3</button>
        <button id="operator" data-value="+">+</button>

        <button id="zero" data-value="0">0</button>
        <button data-value=".">.</button>
        <button id="equal" data-action="equal">=</button>

     </div>

    <footer id="footer">
        SMART CALCULATOR @2026
    </footer>
    
    <script src="script.js"></script>


   </div>
    
</body>
</html>
